.pl-top svg,.add-btn.plat svg,.plist-edit svg,.up-fab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.up-type-ic{display:grid;place-items:center}
.up-type-ic svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.up-fab{background:linear-gradient(145deg,rgb(var(--primary)),rgb(var(--secondary)));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.3),0 12px 28px -6px rgba(var(--primary),.6)}

/* ---------- Progress & volume: glass track, liquid fill, glass bead ---------- */
.progress-track{height:8px;margin-top:-4px;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(255,255,255,.1));
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(255,255,255,.06),0 6px 14px -6px rgba(0,0,0,.5)}
.progress-fill,[dir=rtl] .progress-fill{transition:none;background:linear-gradient(90deg,rgb(var(--primary)),rgb(var(--secondary)),rgb(var(--tertiary)),rgb(var(--primary)));}
@keyframes liquid{to{background-position:-200% 0}}
body.is-playing .progress-track{box-shadow:inset 0 1px 3px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06),0 0 22px -2px rgba(var(--primary),.65)}
.progress-thumb{width:22px;height:22px;margin-top:-11px;margin-inline-start:-11px;transition:none}
.progress-thumb i{opacity:1;transform:scale(.7);border:1px solid rgba(255,255,255,.8);
  background:radial-gradient(circle at 34% 26%,#fff,rgba(255,255,255,.7) 45%,rgba(var(--primary),.55));
  box-shadow:inset 0 -3px 5px rgba(var(--primary),.6),0 1px 2px rgba(0,0,0,.4),0 5px 10px rgba(0,0,0,.35),0 0 16px rgba(var(--primary),.7)}
.vol-slider{height:6px;box-shadow:inset 0 1px 3px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06),0 0 14px -4px rgba(var(--primary),.55)}
.vol-slider::-webkit-slider-thumb{width:16px;height:16px;background:radial-gradient(circle at 34% 26%,#fff,rgba(255,255,255,.72) 55%,rgba(var(--primary),.5));
  box-shadow:inset 0 -2px 3px rgba(var(--primary),.5),0 3px 8px rgba(0,0,0,.45),0 0 10px rgba(var(--primary),.5);transition:transform .5s var(--spring)}

/* ---------- Cover / vinyl: 3D object ---------- */
.stage-wrap{perspective:1100px}
.album-wrap{animation:none;transition:none;will-change:transform}
.album-wrap::before{inset:-34%;opacity:.55;background:radial-gradient(circle,rgba(var(--primary),.34),rgba(var(--secondary),.14) 42%,transparent 70%)}
body.is-playing .album-wrap::before{opacity:.95;animation:aura 7s ease-in-out infinite}
.album-wrap::after{display:none}
.album-ring{opacity:.28}
body.is-playing .album-ring{opacity:.55}
.album-disk{transform:none;transition:box-shadow .6s;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 0 6px rgba(255,255,255,.035),0 0 0 7px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.1),inset 0 0 34px rgba(0,0,0,.55),
    0 2px 3px rgba(0,0,0,.4),0 14px 24px -8px rgba(0,0,0,.55),0 40px 70px -16px rgba(0,0,0,.65),0 0 90px -8px rgba(var(--primary),.4)}
.album-disk img{backface-visibility:hidden}
.album-disk img:not([src]),.album-disk img[src=""]{visibility:hidden}
.album-disk::after{z-index:1;
  background:
    repeating-radial-gradient(circle at 50% 50%,transparent 0 1.6px,rgba(0,0,0,.17) 1.6px 2.4px,rgba(255,255,255,.035) 2.4px 3px),
    repeating-radial-gradient(circle at 50% 50%,transparent 0 17px,rgba(0,0,0,.24) 17px 18.5px),
    radial-gradient(circle,transparent 0 21%,rgba(0,0,0,.55) 21.4% 22.6%,transparent 23% 91%,rgba(0,0,0,.5) 93% 100%),
    radial-gradient(circle at 30% 22%,rgba(255,255,255,.14),transparent 42%),
    radial-gradient(circle,transparent 30%,rgba(0,0,0,.42) 100%)}
.album-disk::before{z-index:1;opacity:1;animation:none;transform:rotate(var(--sa,-40deg));
  background:conic-gradient(from 0deg,transparent 0 6%,rgba(255,255,255,.5) 13%,transparent 22% 48%,rgba(255,255,255,.34) 57%,transparent 66%);
  -webkit-mask-image:radial-gradient(circle,transparent 21%,#000 23%),repeating-radial-gradient(circle,rgba(0,0,0,.35) 0 1.6px,#000 1.6px 3px);
  -webkit-mask-composite:source-in;
  mask-image:radial-gradient(circle,transparent 21%,#000 23%),repeating-radial-gradient(circle,rgba(0,0,0,.35) 0 1.6px,#000 1.6px 3px);
  mask-composite:intersect}
.vx-label{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1;margin:-20% 0 0 -20%;border-radius:50%;pointer-events:none;z-index:1;
  box-shadow:0 0 0 1px rgba(255,255,255,.16),0 0 0 3px rgba(0,0,0,.45),inset 0 0 14px rgba(0,0,0,.45);background:radial-gradient(circle,transparent 38%,rgba(0,0,0,.22))}
.vx-dust{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;pointer-events:none;z-index:1;will-change:transform}
.vinyl-hole{z-index:3}
.aw-rim{position:absolute;inset:-1px;border-radius:50%;padding:2.5px;pointer-events:none;z-index:4;will-change:transform;
  background:conic-gradient(from 0deg,rgba(255,255,255,.95),transparent 14%,transparent 50%,rgba(var(--primary),.55) 70%,transparent 85%,rgba(255,255,255,.9));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.album-reflect{opacity:.34;filter:blur(6px)}
.stage-shadow{position:absolute;z-index:1;pointer-events:none;height:9%;border-radius:50%;filter:blur(12px);will-change:transform,opacity;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.7),rgba(var(--primary),.2) 55%,transparent 75%)}
.stage-wrap.cinema .stage-shadow{display:none}

/* ---------- Earth: tiny, floating, orbiting the cover ---------- */
.earth-widget{top:0;right:auto;left:0;z-index:4;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(110,170,255,.4));will-change:transform}
.stage-wrap.cinema .earth-widget{display:none}
.stage-wrap.cinema{margin-top:0}

/* ---------- Misc ---------- */
.plist-item:hover{background:linear-gradient(100deg,rgba(255,255,255,.12),rgba(255,255,255,.04))}
.modal-body textarea,.up-input,.up-ta{background:rgba(0,0,0,.28);box-shadow:inset 0 2px 8px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.08)}
@media(prefers-reduced-motion:reduce){.g-edge i,.bg-aurora i,.bg-fog i,.progress-fill{animation:none}}

html.lite .bg-aurora,html.lite .g-spec,html.lite .cursor-glow{display:none}
.bg-aurora i{will-change:auto}

/* lighter single blur per card: smooth on phones, same look */
.player-card,.side-card{backdrop-filter:blur(22px) saturate(1.6) brightness(1.05);-webkit-backdrop-filter:blur(22px) saturate(1.6) brightness(1.05)}
@media(max-width:900px){.player-card,.side-card{backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5)}}
.vol-slider:active::-webkit-slider-thumb{transform:scale(1.4)}

/* touch devices: no backdrop blur over a scrolling page (it tiles into blocks); same look from gradients */
@media(hover:none),(pointer:coarse){
  .player-card,.side-card{backdrop-filter:none;-webkit-backdrop-filter:none;
    background:linear-gradient(150deg,rgba(46,50,80,.82),rgba(20,22,40,.86)),rgba(var(--primary),.07)}
  .mini-player{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(135deg,rgba(52,56,88,.94),rgba(24,26,46,.96))}
  .bg-aurora,.bg-rays,.bg-dust,.bg-pulse,.g-spec,.cursor-glow{display:none}
  body.is-playing .album-wrap::before{animation:none}
}

/* visitors never see edit tools */
html:not(.owner-mode):not(.is-admin) #btnLoadLrc,html:not(.owner-mode):not(.is-admin) #btnCover,
html:not(.owner-mode):not(.is-admin) #lvEdit,html:not(.owner-mode):not(.is-admin) #lvAdd,html:not(.owner-mode):not(.is-admin) #lvLrc{display:none!important}

/* fixed palette + polish */
:root{--primary:122,162,255;--secondary:177,127,255;--tertiary:96,224,255;--muted:rgba(238,242,255,.74);--text:#f6f8ff}
body{background:radial-gradient(120% 80% at 20% 0%,#10162e,transparent 60%),radial-gradient(100% 70% at 90% 100%,#1a1034,transparent 60%),#070a14}
.track-info h2{font-weight:800;letter-spacing:0;text-shadow:0 2px 20px rgba(var(--primary),.3)}
.track-info p,.plist-sub,.time-row{color:var(--muted)}
.plist-item.active{background:linear-gradient(100deg,rgba(var(--primary),.26),rgba(var(--secondary),.12));border:1px solid rgba(var(--primary),.4)}
.lyrics-line.active{text-shadow:0 0 18px rgba(var(--primary),.7),0 2px 12px rgba(0,0,0,.5)}
.empty-state{color:var(--muted)}

/* tabs: one pill that glides */
.mode-tabs{position:relative}
.tab-pill{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;pointer-events:none;
  background:linear-gradient(135deg,rgb(var(--primary)),rgb(var(--secondary)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px rgba(var(--primary),.5),0 14px 26px -10px rgba(var(--primary),.5)}
.tab-pill.ready{transition:transform .6s cubic-bezier(.34,1.35,.5,1),width .45s cubic-bezier(.22,1,.36,1)}
.mode-tab.active::before{display:none}
.mode-tab{z-index:1}
.mode-tab.active{color:#fff}

/* softer, richer surfaces */
.top-bar{padding:2px 2px 4px}
.brand{letter-spacing:0}
.side-header{padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.plist-item{padding:11px 14px 11px 12px;border-radius:18px}
.plist-thumb{width:50px;height:50px;border-radius:14px}
.action-chip{padding:9px 18px}
.track-info{padding:0 6px}
.stage-wrap{margin-block:4px}
.empty-state{border:1px dashed rgba(255,255,255,.1);border-radius:20px;margin:6px}
.toast{border:0}

</style>

</head>
<body>

<div class="bg-layer">
  <canvas id="auroraCanvas"></canvas>
  <div class="bg-orbs" id="bgOrbs"><div class="bg-orb a"></div><div class="bg-orb b"></div><div class="bg-orb c"></div></div>
  <div class="bg-rays" aria-hidden="true"><i></i><i></i></div>
  <div class="bg-dust" id="bgDust" aria-hidden="true"></div>
  <div class="bg-blur" id="bgBlur"></div>
  <div class="bg-pulse" id="bgPulse"></div>
  <div class="bg-vignette"></div>
  <div class="bg-noise"></div>
</div>

<div class="app-shell">
  <header class="top-bar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </div>
      Aura
    </div>
    <div class="top-actions">
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="audio" id="tabAudio">أغاني</button>
        <button class="mode-tab" data-mode="video" id="tabVideo">فيديوهات</button>
      </div>
    </div>
  </header>

  <div class="main-grid">
    <section class="player-card" id="playerCard">
      <button class="earth-widget" id="earthWidget" type="button" aria-label="الأرض"><canvas id="earthCanvas" aria-hidden="true"></canvas></button>
      <div class="stage-wrap music" id="stageWrap">
        <canvas id="visualCanvas"></canvas>
        <div class="album-wrap" id="albumWrap">
          <div class="album-ring" aria-hidden="true"></div>
          <div class="album-disk" id="albumDisk">
            <img id="coverImg" src="" alt="غلاف الأغنية" decoding="async" width="400" height="400"/>

            <div class="vinyl-hole"></div>
          </div>
          <div class="album-reflect" aria-hidden="true"></div>
        </div>
        <video id="videoEl" playsinline webkit-playsinline="true" preload="metadata"></video>
        <div class="lyrics-overlay" id="lyricsOverlay">
          <div class="lyrics-line" id="lyricsLine"></div>
        </div>
        <div class="loading-overlay" id="loading"><div class="spinner"></div></div>
      </div>

      <div class="track-info">
        <h2 id="trackTitle">—</h2>
        <p id="trackMeta"></p>
      </div>

      <div class="progress-section">
        <div class="progress-bar" id="progressBar" role="slider" tabindex="0" aria-label="شريط التقدم"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00">
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-thumb" id="progressThumb"><i></i></div>
        </div>
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="btnShuffle" title="عشوائي" aria-label="تشغيل عشوائي" aria-pressed="false">
          <svg id="icShuffleSvg" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="ctrl" id="btnPrev" title="السابق" aria-label="المقطع السابق">
          <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 4h2v16H5V4z"/></svg>
        </button>
        <button class="ctrl play" id="btnPlay" title="تشغيل" aria-label="تشغيل" aria-pressed="false">
          <svg id="icPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl" id="btnNext" title="التالي" aria-label="المقطع التالي">
          <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zm14 0v16h-2V4h2z"/></svg>
        </button>
        <button class="ctrl" id="btnRepeat" title="تكرار: متوقف" aria-label="تكرار: متوقف" aria-pressed="false">
          <svg id="icRepeatSvg" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <button class="ctrl" id="btnMute" style="width:34px;height:34px" title="كتم الصوت" aria-label="كتم الصوت" aria-pressed="false">
          <svg id="icVol" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
          <svg id="icMute" viewBox="0 0 24 24" style="display:none;width:16px;height:16px"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15" stroke-width="2"/><line x1="17" y1="9" x2="23" y2="15" stroke-width="2"/></svg>
        </button>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.01" value="0.85" aria-label="مستوى الصوت"/>
      </div>

      <div class="spectrum-wrap" id="spectrumWrap"></div>

      <div class="lyrics-actions" id="lyricsActions">
        <button class="action-chip" id="btnEditLyrics">
          <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          كلمات
        </button>
        <button class="action-chip" id="btnLoadLrc">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
          LRC
        </button>
        <button class="action-chip" id="btnCover">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          غلاف
        </button>
      </div>
    </section>

    <aside class="sidebar">
      <div class="side-card">
        <div class="side-header">
          <h3>قائمة التشغيل</h3>
          <button class="add-btn" id="btnAdd">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            إضافة
          </button>
        </div>
        <ul class="playlist" id="playlist" role="listbox" aria-label="قائمة التشغيل"></ul>
        <div class="empty-state" id="emptyState" role="status" aria-live="polite">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <span>المكتبة فارغة</span>
        </div>

      </div>
    </aside>
  </div>
</div>

<div class="mini-player" id="miniPlayer">
  <div class="mini-thumb"><img id="miniCover" src="" alt="" decoding="async"/></div>

  <div class="mini-info">
    <div class="mini-title" id="miniTitle">—</div>
    <div class="mini-sub" id="miniSub">—</div>
  </div>
  <div class="mini-ctrls">
    <button class="ctrl" id="miniPrev" aria-label="المقطع السابق"><svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 4h2v16H5V4z"/></svg></button>
    <button class="ctrl play" id="miniPlay" aria-label="تشغيل">
      <svg id="miniIcPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="miniIcPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="ctrl" id="miniNext" aria-label="المقطع التالي"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zm14 0v16h-2V4h2z"/></svg></button>
  </div>
</div>

<div class="lyrics-view" id="lyricsView" role="dialog" aria-modal="true" aria-label="كلمات الأغنية" aria-hidden="true">
  <div class="lv-bg"></div>
  <header class="lv-head">
    <div class="lv-title"><b id="lvTitle"></b><span id="lvSub"></span></div>
    <div class="lv-actions">
      <button class="icon-btn" id="lvEdit" type="button" aria-label="تعديل الكلمات">
        <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <button class="icon-btn" id="lvClose" type="button" aria-label="إغلاق">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>
  <div class="lv-scroll" id="lvScroll"><div class="lv-lines" id="lvLines"></div></div>
  <div class="lv-empty" id="lvEmpty">
    <span>لا توجد كلمات لهذا المقطع بعد</span>
    <div class="row">
      <button class="add-btn" id="lvAdd" type="button">إضافة كلمات</button>
      <button class="action-chip" id="lvLrc" type="button">ملف LRC</button>
    </div>
  </div>
  <footer class="lv-foot">
    <div class="lv-prog"><i id="lvProgFill"></i></div>
    <button class="lv-play" id="lvPlay" type="button" aria-label="تشغيل">
      <svg id="lvIcPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="lvIcPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
  </footer>
</div>

<div class="modal-bg" id="lyricsModal">
  <div class="modal" role="dialog" aria-modal="true" aria-label="الكلمات">
    <div class="modal-head">
      <h3>الكلمات</h3>
      <button class="icon-btn" id="modalClose" style="width:32px;height:32px" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" fill="none" stroke-width="2.5"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <label>تنسيق LRC أو نص عادي</label>
      <textarea id="lyricsTA" placeholder=""></textarea>
      
    </div>
    <div class="modal-foot">
      <button class="modal-btn cancel" id="modalCancel">إلغاء</button>
      <button class="modal-btn save" id="modalSave">حفظ</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.mp4,.mov,.webm,.mkv" multiple/>
<input type="file" id="lrcInput" accept=".lrc,.txt,text/*,application/octet-stream"/>
<input type="file" id="coverInput" accept="image/*"/>
<input type="file" id="upMediaInput" accept="audio/*,video/*" style="display:none"/>
<input type="file" id="upCoverInput" accept="image/*" style="display:none"/>

<!-- Mobile-friendly upload sheet (owner only) -->
<div class="modal-bg" id="uploadModal">
  <div class="modal up-sheet" role="dialog" aria-modal="true" aria-label="رفع ملف">
    <div class="modal-head">
      <h3 id="upTitle">رفع ملف</h3>
      <button class="icon-btn" id="upClose" type="button" style="width:32px;height:32px" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" fill="none" stroke-width="2.5"/></svg>
      </button>
    </div>
    <div class="modal-body up-body">
      <div class="up-step" id="upStepType">
        <p class="up-hint">اختَر نوع الملف</p>

function parseLRC(text) {
  const raw = String(text || '').replace(/^\uFEFF/, '');
  const META = /\[(?:ti|ar|al|au|by|re|ve|length|offset|la|id|tool|total|#)\s*:[^\]]*\]/gi;
  const STAMPS = /^\s*((?:\[\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?\]\s*)+)/;
  const STAMP = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
  const WTAG = /<(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?>/;
  const toSec = (m, s, f) => (+m) * 60 + (+s) + (f ? +('0.' + f) : 0);
  const om = raw.match(/\[offset\s*:\s*(-?\d+)\s*\]/i);
  const offset = om ? (+om[1]) / 1000 : 0;
  const result = [];
  raw.split(/\r?\n/).forEach(function (line0) {
    // drop metadata tags and invisible bidi marks that break matching on pasted RTL text
    let line = line0.replace(META, '').replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g, '');
    if (!line.trim()) return;
    const stamps = [];
    const sm = line.match(STAMPS);
    if (sm) {
      let m;
      STAMP.lastIndex = 0;
      while ((m = STAMP.exec(sm[1])) !== null) stamps.push(toSec(m[1], m[2], m[3]) - offset);
      line = line.slice(sm[0].length);
    }
    // enhanced LRC: <mm:ss.xx>word<mm:ss.xx>word  (split keeps the 3 captured groups of every tag)
    const parts = line.split(new RegExp(WTAG.source));
    const words = [], wt = [];
    let end = null, tagged = false;
    const pushText = function (txt, t, tNext) {
      const toks = txt.split(/\s+/).filter(Boolean);
      toks.forEach(function (tok, i) {
        words.push(tok);
        wt.push(t == null ? null : (tNext != null && tNext > t ? t + (tNext - t) * i / toks.length : t + i * 0.2));
      });
    };
    if (parts.length === 1) {
      pushText(line, null, null);
    } else {
      tagged = true;
      const tags = [];
      for (let k = 1; k + 3 < parts.length; k += 4) {
        tags.push({ t: toSec(parts[k], parts[k + 1], parts[k + 2]) - offset, txt: parts[k + 3] || '' });
      }
      if (parts[0].trim() && tags.length) pushText(parts[0], stamps.length ? stamps[0] : tags[0].t, tags[0].t);
      tags.forEach(function (g, i) {
        if (!g.txt.trim()) { if (i === tags.length - 1) end = g.t; return; }
        pushText(g.txt, g.t, i + 1 < tags.length ? tags[i + 1].t : null);
      });
    }
    if (!words.length) return;
    const hasWt = tagged && wt.every(function (x) { return x != null; });
    const content = words.join(' ');
    const base = stamps.length ? stamps : (hasWt ? [wt[0]] : []);
    if (base.length) {
      base.forEach(function (st, i) {
        const own = hasWt && i === 0;
        result.push({ time: st, text: content, words: words.slice(), wt: own ? wt.slice() : null, end: own ? end : null });
      });
    } else {
      result.push({ time: -1, text: content, words: words, wt: null, end: null });
    }
  });
  return result.sort((a, b) => a.time - b.time);
}

function setLyrics(raw) {

function showLyric(idx) {
  if (idx < 0 || idx >= lyricsData.length || idx === currentLyricIdx) return;
  currentLyricIdx = idx;
  _lwIdx = -1;
  const line = lyricsData[idx];
  lyricsLine.innerHTML = line.words.map((w, i) =>

function updateLyrics(time) {
  if (!lyricsData.length) return;
  if (lyricsData !== _hasTFor) { _hasTFor = lyricsData; _hasT = lyricsData.some(l => l.time >= 0); }
  if (!_hasT) return;
  let idx = -1;
  for (let i = 0; i < lyricsData.length; i++) {
    if (lyricsData[i].time >= 0 && lyricsData[i].time <= time + 0.12) idx = i;
    else if (lyricsData[i].time > time) break;
  }
  if (idx >= 0) {
    showLyric(idx);
    const line = lyricsData[idx];
    let activeWord = -1;
    if (line.wt) { // real per-word timing from enhanced LRC
      for (let i = 0; i < line.wt.length; i++) { if (line.wt[i] <= time + 0.03) activeWord = i; else break; }
    } else {
      const nextT = lyricsData[idx + 1] ? lyricsData[idx + 1].time : (line.time + 4);
      const progress = Math.min(1, (time - line.time) / Math.max(0.5, nextT - line.time));
      activeWord = Math.floor(progress * line.words.length);
    }
    if (idx !== _lwIdx || activeWord !== _lwWord) {
      _lwIdx = idx; _lwWord = activeWord;
      lyricsLine.querySelectorAll('.word').forEach((el, i) => {
        el.classList.toggle('sung', i <= activeWord);
      });
    }
  }
}

function togglePlay() {

    const idx = playlist.findIndex(function(p) {
      return currentMode === 'audio' ? !p.isVideo : p.isVideo;
    });
    if (idx >= 0) playIndex(idx);
    return;
  }
  if (!videoEl.paused) {
    videoEl.pause();
  } else {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
    videoEl.play().catch(function() {});
  }
  // isPlaying is driven by the play/pause events to avoid race
  updatePlayIcons();
}


function nextTrack() {
  const cands = playlist.map(function(p,i){return {p:p,i:i};})
    .filter(function(c){return currentMode === 'audio' ? !c.p.isVideo : c.p.isVideo;});
  if (!cands.length) return;
  var next;
  if (isShuffle) next = cands[Math.floor(Math.random()*cands.length)].i;
  else {
    var pos = cands.findIndex(function(c){return c.i === currentIndex;});
    if (pos < 0) next = cands[0].i;
    else if (pos + 1 < cands.length) next = cands[pos+1].i;
    else if (repeatMode === 1) next = cands[0].i;
    else return;
  }
  playIndex(next);
}

function prevTrack() {
  if (videoEl.currentTime > 3) { videoEl.currentTime = 0; return; }
  var cands = playlist.map(function(p,i){return {p:p,i:i};})
    .filter(function(c){return currentMode === 'audio' ? !c.p.isVideo : c.p.isVideo;});
  if (!cands.length) return;
  var pos = cands.findIndex(function(c){return c.i === currentIndex;});
  playIndex(cands[pos <= 0 ? cands.length-1 : pos-1].i);
}

function seek(e) {

  var rect = _prect || progressBar.getBoundingClientRect();
  var pct = (e.clientX - rect.left) / rect.width;

  } else if (e.code === 'End') {

  }
});

function mediaKind(f) {
  var t = f.type || '', n = (f.name || '').toLowerCase();
  if (/^audio\//.test(t)) return 'audio';
  if (/^video\//.test(t)) return 'video';
  if (/\.(mp3|m4a|aac|wav|flac|ogg|oga|opus|wma|aiff?|amr|weba)$/.test(n)) return 'audio';
  if (/\.(mp4|m4v|mov|webm|mkv|avi|3gp|ogv)$/.test(n)) return 'video';
  return '';
}
function addFiles(files) {
  var items = [];
  files.forEach(function(f) {
    var k = mediaKind(f); if (!k) return;
    items.push({
      name: f.name.replace(/\.[^/.]+$/, ''),
      url: URL.createObjectURL(f),
      file: f,
      isVideo: k === 'video',
      cover: null, coverFile: null, lyrics: [], lyricsRaw: '', _id: null
    });
  });
  if (!items.length) return;
  var shouldAutoplay = currentIndex < 0;
  playlist = playlist.concat(items);
  renderPlaylist();
  if (shouldAutoplay) {
    var i = playlist.findIndex(function(p) {
      return currentMode === 'audio' ? !p.isVideo : p.isVideo;
    });
    if (i >= 0) playIndex(i);
  }
  schedulePersist();
}

/* ==================================================================
   OWNER GATE: nobody can switch on the upload tools without the owner PIN
   (inside the platform: only when the bridge says admin).
   NOTE: this hides the tools on the client; real protection must be server-side.
   ================================================================== */
(function () {
  var OWNER_PIN = '123456';              /* <-- change me */
  var granted = false;
  function bridgeAdmin() { try { var B = window.parent !== window ? window.parent.__auraBridge : null; return B ? !!B.admin() : null; } catch (e) { return null; } }
  function ask(cb) {
    var ba = bridgeAdmin();
    if (ba !== null) { granted = ba; if (!ba) { try { window.toast('الرفع للأدمن فقط'); } catch (e) {} } return ba; }
    if (granted) return true;
    var o = document.createElement('div'); o.className = 'modal-bg show';
    o.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>وضع المالك</h3></div><div class="modal-body"><label>رمز المالك</label><input class="up-input" type="password" inputmode="numeric" autocomplete="off" dir="ltr"/></div><div class="modal-foot"><button class="modal-btn cancel" type="button">إلغاء</button><button class="modal-btn save" type="button">دخول</button></div></div>';
    document.body.appendChild(o);
    var inp = o.querySelector('input'), bs = o.querySelectorAll('button');
    function close() { o.remove(); }
    function go() { if (inp.value === OWNER_PIN) { granted = true; close(); cb(); } else { inp.value = ''; try { window.toast('الرمز غلط'); } catch (e) {} } }
    bs[0].onclick = close; bs[1].onclick = go;
    inp.onkeydown = function (e) { if (e.key === 'Enter') go(); if (e.key === 'Escape') close(); };
    o.onclick = function (e) { if (e.target === o) close(); };
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60);
    return false;
  }
  Object.defineProperty(window, '__askOwner', { value: ask, writable: false, configurable: false });
})();

/* ==================================================================
   READ-ONLY FOR VISITORS: lyrics / LRC / cover can only be changed by the owner
   (owner mode with PIN, or platform admin). Visitors can still READ lyrics.
   ================================================================== */
(function () {
  var de = document.documentElement;
  function can() { return de.classList.contains('owner-mode') || de.classList.contains('is-admin'); }
  function deny(e) { if (!can()) { e.preventDefault(); e.stopImmediatePropagation(); try { window.toast('التعديل للمالك فقط'); } catch (x) {} } }
  ['btnLoadLrc', 'btnCover', 'lvEdit', 'lvAdd', 'lvLrc', 'modalSave'].forEach(function (id) { var b = $(id); if (b) b.addEventListener('click', deny, true); });
  ['lrcInput', 'coverInput'].forEach(function (id) { var i = $(id); if (i) i.addEventListener('change', function (e) { if (!can()) { e.stopImmediatePropagation(); i.value = ''; } }, true); });
  var _ol = openLyricsEditor; openLyricsEditor = function () { if (can()) return _ol.apply(this, arguments); };
  var _sl = setLyrics; setLyrics = function (raw) { if (!can()) return; return _sl(raw); };
})();

/* ==================================================================
   SMOOTH SONGS <-> VIDEOS: sliding tab pill + soft staggered entrance
   (state still changes synchronously, so no logic is delayed)
   ================================================================== */
(function () {
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tabs = document.querySelector('.mode-tabs'); if (!tabs) return;
  var pill = document.createElement('i'); pill.className = 'tab-pill'; pill.setAttribute('aria-hidden', 'true'); tabs.insertBefore(pill, tabs.firstChild);
  function place() { var a = tabs.querySelector('.mode-tab.active'); if (!a) return; pill.style.width = a.offsetWidth + 'px'; pill.style.transform = 'translateX(' + a.offsetLeft + 'px)'; }
  place(); requestAnimationFrame(function () { requestAnimationFrame(function () { pill.classList.add('ready'); }); });
  if (window.ResizeObserver) new ResizeObserver(place).observe(tabs); addEventListener('resize', place);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  var _sm = setMode;
  setMode = function (m) {
    var changed = m !== currentMode;
    _sm(m); place();
    if (!changed || RM) return;
    [[stageWrap, 0], [document.querySelector('.track-info'), 60], [playlistEl, 120]].forEach(function (p) {
      if (p[0] && p[0].animate) try { p[0].animate([{ opacity: 0, transform: 'translate3d(0,14px,0) scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 520, delay: p[1], easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' }); } catch (e) {}
    });
  };
})();
</script>
